name: SpatiusScenes
options:
  bundleIdPrefix: ai.spatialwalk.scenes
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  AvatarKitRTC:
    url: https://github.com/spatius-ai/avatarkit-ios-rtc.git
    exactVersion: 1.0.0

targets:
  SpatiusScenes:
    type: application
    platform: iOS
    sources:
      - path: SpatiusScenes
    dependencies:
      - package: AvatarKitRTC
        product: AvatarKitRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.spatialwalk.scenes
        DEVELOPMENT_TEAM: 4T2SFHD6HA
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SpatiusScenes/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Device arm64 only: neither Agora nor AvatarKit, which RTC depends on,
        # ships a simulator slice.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
